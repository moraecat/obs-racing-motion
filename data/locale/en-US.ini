FilterName="Racing Motion — Direct Telemetry"
Game="Game"
Port="Game UDP port"
LAN="Receive from LAN (otherwise this PC only)"
InputHelp="Matching game and port share one receiver. For UDP games, send telemetry to 127.0.0.1 and the port above. Common defaults: Forza 5300, FH6 5301, F1 20777. Close other receivers using that port."
TruckHelp="ETS2 / ATS requires the included racing-motion-scs.dll in the game's bin/win_x64/plugins folder. Restart the game after installing. No separate program is needed."
Waiting="Waiting for driving data"
Receiving="Receiving"
PreviewActive="Preview motion"
PreviewActual="Preview active / actual received values below"
LiveMonitor="Open live telemetry window"
LiveHelp="View real 6-axis data, speed, RPM, gear, sample age and applied motion in a separate window refreshed 5 times per second while adjusting settings."
MonitorTitle="Racing Motion — Live telemetry"
FilterDisabled="Filter disabled"
ActualInput="Actual received values (last sample while waiting)"
SimulatedInput="Preview input (not live game data)"
AppliedOutput="Applied source motion"
Refresh="Refresh connection status / values"
Preview="Preview motion without a game"
Intensity="Overall intensity (%)"
InputGain="Input amplification (x)"
MicroSensitivity="Small-input sensitivity (%)"
MicroHelp="Emphasizes small inputs to reveal fine road vibration. 0% preserves the original response; 100% adds up to about 10x sensitivity near zero. Start at 50%. Try 20–40ms smoothing for faster vibration. Input noise is amplified too; lower sensitivity if stationary jitter is excessive."
InputGainHelp="Amplify small acceleration and tilt changes by 1–20x. Try 5x for subtle truck telemetry. Multiplies overall intensity while preserving motion limits. High gain may reach the limits with small inputs. Actual received values in the live monitor remain unmodified."
Horizontal="Maximum horizontal movement (source pixels)"
Vertical="Maximum vertical movement (source pixels)"
Rotation="Maximum rotation (degrees)"
PivotX="Rotation pivot horizontal (%)"
PivotY="Rotation pivot vertical (%)"
PivotHelp="Horizontal: 0=left, 50=center, 100=right. Vertical: 0=top, 50=center, 100=bottom. Use 50 / 100 to lean around the bottom center. Coordinates refer to the original source, excluding transparent padding."
SurgeScale="Maximum surge zoom in/out (%)"
SurgeVertical="Maximum surge vertical movement (source pixels)"
InvertSurge="Invert surge response"
SurgeHelp="Acceleration shrinks and raises the source; braking enlarges and lowers it. Set either limit to 0 to disable that cue. At 100% intensity and 1x input amplification, 0.5 G reaches the limits. Vertical surge adds to road-bump movement."
InvertX="Invert horizontal direction"
InvertY="Invert vertical direction"
InvertRotation="Invert rotation direction"
Smoothing="Smoothing (ms)"
Return="Return to neutral (ms)"
Padding="Transparent padding per side (pixels)"
PaddingHelp="0 preserves the original source dimensions; edges can be cropped while moving. Add padding for more room, then adjust the source layout once. Reused OBS sources share filters; duplicate the source for independent motion."
