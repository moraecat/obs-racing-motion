Padding="가장자리 투명 여백 (한쪽당 픽셀)"
PaddingHelp="0이면 원래 소스 크기를 유지하며, 이동 중 가장자리가 잘릴 수 있습니다. 여백을 추가하면 움직일 공간이 생기지만 소스 크기가 바뀌므로 배치를 한 번 조정하세요. OBS에서 같은 소스를 재사용하면 필터도 공유됩니다. 독립적인 움직임에는 소스를 복제하세요."
