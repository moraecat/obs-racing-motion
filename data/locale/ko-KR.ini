PivotX="회전 중심 가로 (%)"
PivotY="회전 중심 세로 (%)"
PivotHelp="가로 0=왼쪽, 50=중앙, 100=오른쪽 / 세로 0=위, 50=중앙, 100=아래. 하단 중앙을 기준으로 기울이려면 50 / 100으로 설정하세요. 투명 여백을 제외한 원본 소스 기준입니다."
SurgeScale="전후 최대 확대·축소 (%)"
