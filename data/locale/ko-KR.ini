MicroSensitivity="미세 입력 감도 (%)"
MicroHelp="작은 입력을 더 많이 키워 미세한 노면 진동을 드러냅니다. 0%는 기존 반응, 100%는 작은 입력에 최대 약 10배의 추가 감도입니다. 50%부터 조절하세요. 빠른 진동을 살리려면 부드러움도 20~40ms로 낮춰 보세요. 실제 입력의 잡음도 커지므로 정차 중 떨림이 심하면 감도를 낮추세요."
InputGainHelp="작은 가속도·기울기 변화를 1~20배 증폭합니다. 유로트럭처럼 반응이 약하면 5배부터 조절하세요. 전체 강도와 곱해지며 최대 이동·회전·확대 범위는 유지됩니다. 너무 높으면 작은 변화에도 최대값에 도달할 수 있습니다. 실시간 창의 실제 수신값은 원본 그대로 표시됩니다."
Horizontal="최대 좌우 이동 (소스 픽셀)"
