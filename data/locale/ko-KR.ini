InvertSurge="전후 반응 방향 반전"
SurgeHelp="가속하면 작아지며 위로, 제동하면 커지며 아래로 움직입니다. 두 값을 각각 0으로 설정하면 해당 효과가 꺼집니다. 전체 강도 100%·입력 증폭 1배에서 전후 가속도 0.5G가 최대값에 대응합니다. 노면 요철의 상하 이동과 합산됩니다."
InvertX="좌우 방향 반전"
