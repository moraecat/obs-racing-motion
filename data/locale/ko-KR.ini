InputHelp="같은 게임·포트의 필터는 수신기를 공유합니다. UDP 게임에서 수신 주소를 127.0.0.1, 포트를 위 값으로 맞추세요. 일반적인 포트: Forza 5300, FH6 5301, F1 20777. 같은 포트를 사용하는 기존 수신 프로그램은 종료하세요."
TruckHelp="유로트럭/아메리칸 트럭은 함께 제공된 racing-motion-scs.dll을 게임의 bin/win_x64/plugins 폴더에 설치해야 합니다. 설치 후 게임을 다시 시작하세요. 별도 실행 프로그램은 필요 없습니다."
